# Datasets shared by several models of the PROTEUS ecosystem.
#
# One TOML table per dataset:
#
#   [group.dataset_key]
#   name = "Human-readable dataset name"
#   subdir = "relative/path/below/FWL_DATA"
#   zenodo = "10.5281/zenodo.<record-id>"     # version DOI, never a concept DOI
#   dataverse = "10.34894/<id>"               # optional mirror
#   required_by = ["model_a", "model_b"]
#
# Each dataset has a committed registry file next to this manifest, named
# <group>.<dataset_key>.registry.txt, generated by:  fwl-io sync <this file>
#
# Model-specific datasets do NOT belong here: declare them in the consuming
# model's own manifest and expose it through the "fwl_io.manifests"
# entry-point group. This file is only for data consumed by several models
# (spectral files, multi-consumer lookup tables).

# The Baraffe tracks are consumed by MORS only; they are hosted here as the
# first live dataset until MORS ships its own manifest with its migration,
# which will move this table into the MORS package. This covers the Baraffe
# half of the MORS stellar tracks; the Spada grid (Zenodo record 15729101, a
# single 60 MB tarball that MORS extracts after download) is deferred until
# archive extraction lands (fwl-io issue #2).
[stellar_evolution_tracks.Baraffe]
name = "Baraffe et al. (2015) stellar evolution tracks (BHAC15)"
subdir = "stellar_evolution_tracks/Baraffe"
zenodo = "10.5281/zenodo.15729114"
required_by = ["mors"]

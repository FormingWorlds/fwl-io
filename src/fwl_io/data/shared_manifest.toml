# Datasets shared by several models of the PROTEUS ecosystem.
#
# One TOML table per dataset, below an optional schema declaration:
#
#   manifest_schema = 1
#
#   [group.dataset_key]
#   name = "Human-readable dataset name"
#   zenodo = "10.5281/zenodo.<record-id>"     # version DOI, never a concept DOI
#   dataverse = "10.34894/<id>"               # optional mirror
#   required_by = ["model_a", "model_b"]
#
# The dotted table key is the dataset location below FWL_DATA, so the table
# above lands in FWL_DATA/group/dataset_key/r<record-id>, the version directory
# named for its Zenodo record.
#
# Each dataset has a committed registry file next to this manifest, named
# <dotted-key>.registry.txt, generated by:  fwl-io sync <this file>
#
# Model-specific datasets do NOT belong here: declare them in the consuming
# model's own manifest and expose it through the "fwl_io.manifests"
# entry-point group. This file is only for data several models read (spectral
# files, stellar spectra, equations of state, melting curves, lookup tables).
#
# A dataset without required_by is not part of `fwl-io fetch <model>` or
# `fwl-io check <model>`: it is fetched on demand by its consumer, through
# the dataset key. The interior tables the Zalmoxis setup links carry required_by;
# the spectral files and stellar spectra (many gigabytes) do not.
#
# The Baraffe stellar tracks ship with the MORS package, which owns their
# manifest and registry.

manifest_schema = 1

[atmos_clim.spectral_files.frostflow.16]

name: PALEOS pins at their newest Zenodo version

# Reads Zenodo only: one API call per pinned PALEOS record, no retry, no token. A newer
# version, or no record read at all, fails the run, so the scheduled run sends its failure
# notice; a single record that could not be read leaves a warning and passes.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: PALEOS pins are the newest versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fwl-io
        run: pip install -e .

      - name: Compare each PALEOS pin with its newest Zenodo version
        shell: bash
        run: |
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          set +e
          fwl-io latest --prefix interior.eos.paleos | tee -a "${GITHUB_STEP_SUMMARY}"
          code=${PIPESTATUS[0]}
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          case "${code}" in
            5) echo "::error title=Newer PALEOS tables on Zenodo::pin the newest version in the shared manifest; see the summary"; exit 1 ;;
            4) echo "::error title=Zenodo not read::no PALEOS record could be read; see the summary"; exit 1 ;;
            3) echo "::warning title=Zenodo not fully read::a PALEOS record could not be read; see the summary"; exit 0 ;;
            *) exit "${code}" ;;
          esac

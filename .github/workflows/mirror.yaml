name: Mirror a Zenodo deposit to Dataverse

# Manually triggered: mirrors one pinned Zenodo deposit into the Proteus Framework collection
# on DataverseNL. The API token is a secret of the dataverse environment and lives only in
# CI; a run waits for the approval that this environment asks for.

on:
  workflow_dispatch:
    inputs:
      zenodo_doi:
        description: "Zenodo version DOI to mirror (10.5281/zenodo.<record-id>)"
        required: true
      collection:
        description: "Dataverse collection alias"
        required: true
        default: "Proteus_Fr"
      files:
        description: "Only these files of the deposit, separated by spaces (empty: the whole deposit)"
        required: false
        default: ""
      licence:
        description: "Dataverse license name for a new draft in place of the Zenodo one, only where the author licenses it so; never published (empty: from Zenodo)"
        required: false
        default: ""
      into:
        description: "Persistent id of an existing draft of this record to complete, never published (empty: create one)"
        required: false
        default: ""
      dry_run:
        description: "Download and map metadata only; make no Dataverse changes"
        type: boolean
        default: false
      publish:
        description: "Publish the created dataset (unchecked: leave it a draft to review)"
        type: boolean
        default: false

# Runs with the same into value (or the same Zenodo DOI) wait for each other; a second
# pending run replaces the first, and other spellings of one DOI are not grouped.
concurrency:
  group: mirror-${{ inputs.into || inputs.zenodo_doi }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: dataverse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fwl-io
        run: pip install -e .

      - name: Mirror the deposit
        env:
          DATAVERSE_TOKEN: ${{ secrets.DATAVERSE_TOKEN }}
          DATAVERSE_CONTACT_EMAIL: ${{ secrets.DATAVERSE_CONTACT_EMAIL }}
          # Bind the user inputs to environment variables rather than
          # interpolating them into the shell script, so a crafted DOI or
          # collection name cannot inject commands into a job that holds the token.
          ZENODO_DOI: ${{ inputs.zenodo_doi }}
          COLLECTION: ${{ inputs.collection }}
          FILES: ${{ inputs.files }}
          INTO: ${{ inputs.into }}
          LICENCE: ${{ inputs.licence }}
        run: |
          set -f
          file_args=()
          for name in ${FILES}; do file_args+=(--file "${name}"); done
          if [ -n "${LICENCE}" ]; then file_args+=(--licence "${LICENCE}" --no-publish); fi
          if [ -n "${INTO}" ]; then file_args+=(--into "${INTO}" --no-publish); fi
          fwl-io mirror "${ZENODO_DOI}" \
            --collection "${COLLECTION}" \
            --contact-email "${DATAVERSE_CONTACT_EMAIL}" \
            "${file_args[@]}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ !inputs.publish && '--no-publish' || '' }}

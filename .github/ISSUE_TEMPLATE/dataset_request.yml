name: Dataset request
description: Ask for a new dataset, or a new version of a dataset, in the PROTEUS Framework community on Zenodo.
title: "Dataset request: "
body:
  - type: markdown
    attributes:
      value: |
        A dataset of the framework is a record of the [PROTEUS Framework community on Zenodo](https://zenodo.org/communities/proteus_framework). This form asks the maintainers to bring your data there. The steps of each route are in [Add a dataset](https://proteus-framework.org/fwl-io/How-to/add_dataset/).
  - type: dropdown
    id: route
    attributes:
      label: Route
      description: Who uploads the data to Zenodo?
      options:
        - A maintainer uploads my data
        - I upload the record myself and submit it to the community
        - My record exists on Zenodo; add it to the community
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: New dataset or new version
      options:
        - A new dataset
        - A new version of a record that exists
    validations:
      required: true
  - type: input
    id: zenodo_doi
    attributes:
      label: Zenodo DOI
      description: The version DOI (10.5281/zenodo.<record-id>) of your record, when it exists. For a new version, the DOI of the version that it replaces. Leave empty for data that is not on Zenodo.
    validations:
      required: false
  - type: input
    id: download_link
    attributes:
      label: Download link
      description: 'Required for the route "A maintainer uploads my data": a folder on Google Drive, Dropbox or another service that the maintainers can read. Leave empty for the other routes.'
    validations:
      required: false
  - type: input
    id: dataset_title
    attributes:
      label: Title
      description: The title of the dataset, as the Zenodo record must show it.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Short description
      description: What the data is and how it was made, in a few sentences. It becomes the description of the Zenodo record.
    validations:
      required: true
  - type: input
    id: models
    attributes:
      label: Models that read the data
      description: For example aragog, zalmoxis, agni.
    validations:
      required: true
  - type: input
    id: dataset_key
    attributes:
      label: Proposed dataset key
      description: The dotted key, which is also the place of the files below FWL_DATA, for example interior.eos.my_table.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: One line per file, with its name and its size.
      render: text
    validations:
      required: true
  - type: input
    id: licence
    attributes:
      label: Licence
      description: The licence of the data, for example CC-BY-4.0.
    validations:
      required: true
  - type: textarea
    id: authors
    attributes:
      label: Authors
      description: One line per author, with name, affiliation and ORCID.
      render: text
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: The person who answers questions on the data (GitHub handle or email address).
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference to cite
      description: The DOI of the publication that users of the data must cite.
    validations:
      required: true
  - type: checkboxes
    id: readme
    attributes:
      label: README
      options:
        - label: The data holds a README that describes each file (format, columns, units, source).
          required: true
